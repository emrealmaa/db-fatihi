# Karar verilene kadar tüm veritabanları "profile" ile isteğe bağlıdır.
# Örnek: docker compose --profile postgres up -d
services:
  postgres:
    profiles: [postgres, all]
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_PORT}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro

  mysql:
    profiles: [mysql, all]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports: ["${MYSQL_PORT}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d:ro

  mongo:
    profiles: [mongo, all]
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports: ["${MONGO_PORT}:27017"]
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro

  neo4j:
    profiles: [neo4j, all]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
      - ./db/neo4j/init:/init:ro

  # Apple Silicon'da amd64 emülasyonuyla çalışır (yavaş olabilir).
  # SSIS/SSAS Windows gerektirir; bu konteyner yalnızca SQL Server motorudur.
  mssql:
    profiles: [mssql, all]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["${MSSQL_PORT}:1433"]
    volumes:
      - mssql_data:/var/opt/mssql
      - ./db/mssql/init:/init:ro

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  neo4j_data:
  mssql_data:
